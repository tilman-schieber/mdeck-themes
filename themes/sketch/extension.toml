schema = 1
kind = "theme"
id = "sketch"
title = "Sketch"
description = "A sketchbook: Caveat and Patrick Hand on dotted paper, marker scribbles, circled numbers, sticky-note callouts and taped photos; a chalkboard in the dark."
version = "1.2.1"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "pastel"
fonts = [
  "https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) at 1920×1080: handwriting has a small x-height, so the
# sizes are larger than in the other themes.
"--fs-display" = "176px"
"--fs-title" = "140px"
"--fs-focus" = "84px"
"--fs-h" = "96px"
"--fs-sub" = "44px"
"--fs-body" = "38px"
"--fs-small" = "27px"
"--fs-eyebrow" = "32px"

# Spacing
"--pad-x" = "128px"
"--pad-y" = "64px"
"--gap-title" = "40px"
"--gap-item" = "20px"

# Type families
"--font-display" = "\"Caveat\", \"Segoe Print\", \"Bradley Hand\", cursive"
"--font-body" = "\"Patrick Hand\", \"Segoe Print\", \"Comic Sans MS\", cursive"
"--font-mono" = "\"Courier Prime\", \"Courier New\", monospace"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["workshops and brainstorming", "teaching and explaining ideas", "informal team talks"]
avoid = ["formal reports", "code-heavy talks"]
writing = """
A sketchbook: handwriting fonts, numbers circled by hand, list arrows,
sticky-note callouts and photos taped in. Keep text short, as on a sheet of
notes. Callouts (::: tip, ::: note) are sticky notes, a statement (layout:
focus) is a speech bubble, and pictures look taped in. In the dark it is a
chalkboard.
"""
