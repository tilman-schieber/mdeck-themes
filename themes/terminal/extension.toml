schema = 1
kind = "theme"
id = "terminal"
title = "Terminal"
description = "A terminal session: JetBrains Mono, headings at a prompt, a blinking cursor, log-line callouts and a tmux status bar; dark by default."
version = "1.3.2"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.10.1"  # a setting of the kind text
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "phosphor"
appearance = "dark"
fonts = [
  "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# The prompt before each heading, as a quoted CSS string.
"--prompt" = "'~/talk $ '"
# Whether the cursor blinks (1) or holds still (0).
"--motion" = "1"
# Whether chapters show scanlines (1) or not (0).
"--texture" = "1"
# Type families — monospace throughout
"--font-display" = "'JetBrains Mono', ui-monospace, monospace"
"--font-body" = "'JetBrains Mono', ui-monospace, monospace"

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "112px"
"--fs-h" = "60px"
"--fs-sub" = "36px"
"--fs-body" = "29px"
"--fs-eyebrow" = "24px"
"--fs-small" = "24px"
"--fs-focus" = "72px"
"--fs-title" = "96px"

# Spacing
"--pad-x" = "120px"
"--pad-y" = "72px"
"--gap-title" = "44px"
"--gap-item" = "24px"

[params.prompt]
token = "--prompt"
title = "Prompt"
type = "text"
description = "What stands before each heading and command, \"~/talk $ \" by default: your project, your host, the event (\"~/kubecon $ \"). Keep it short and end it with a space."

[params.motion]
token = "--motion"
title = "Motion"
type = "switch"
description = "1 (the default) lets the cursor on the title move while presenting; 0 keeps it still, for recordings or a calm room. Print and reduced motion are always still."

[params.texture]
token = "--texture"
title = "Texture"
type = "switch"
description = "1 (the default) shows faint scanlines on chapter slides; 0 leaves a clean screen, for a washed-out projector or a handout."

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["developer and ops talks", "live demos and tooling", "command-line tutorials"]
avoid = ["photo-led talks", "non-technical audiences"]
writing = """
Monospace throughout, dark by default. Headings read as commands typed at a
prompt, so short lowercase headings fit well ("install the tools"); set
the prompt to the project or the event (params: prompt: "~/kubecon $ "). Code
blocks are terminal windows with a title bar; callouts are log lines. Use real
commands and output where they make the point.
"""
