schema = 1
kind = "theme"
id = "pop"
title = "Pop"
description = "Thick outlines, hard shadows and flat pastel fills, in the spirit of pop art; Lexend throughout."
version = "1.3.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "swiss"
fonts = [
  "https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
[tokens]
"--fs-display" = "140px"
"--fs-title" = "108px"
"--fs-focus" = "80px"
"--fs-h" = "68px"
"--fs-sub" = "38px"
"--fs-body" = "32px"
"--fs-small" = "24px"
"--fs-eyebrow" = "22px"
"--pad-x" = "140px"
"--pad-y" = "80px"
"--gap-title" = "48px"
"--gap-item" = "24px"
"--edge" = "5px"
"--shadow" = "12px"
"--font-display" = "Lexend, system-ui, sans-serif"
"--font-body" = "Lexend, system-ui, sans-serif"

[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

[params.edge]
token = "--edge"
title = "Outline width"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["workshops and classes", "playful and creative talks", "short points in big type"]
avoid = ["formal or sombre talks", "dense tables"]
writing = """
Titles, headings, callouts and code are cut-out shapes with thick outlines and
hard shadows, so keep text short: one idea per shape. Emphasis (*word*) is a
marker highlight in running text and an underline on the shapes; use it for a
word or two.
"""
