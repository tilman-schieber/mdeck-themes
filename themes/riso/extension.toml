schema = 1
kind = "theme"
id = "riso"
title = "Riso"
description = "A risograph zine: two spot inks that overprint where they meet, halftone dots, paper grain, pictures printed in the inks and headings slightly out of register; Bricolage Grotesque with Space Mono for the small print."
version = "0.3.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.9.0"  # parameters with a type
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "fluoro"
fonts = [
  "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]
"--fs-display" = "150px"
"--fs-title" = "116px"
"--fs-focus" = "84px"
"--fs-h" = "70px"
"--fs-sub" = "38px"
"--fs-body" = "33px"
"--fs-small" = "22px"
"--fs-eyebrow" = "21px"
"--pad-x" = "140px"
"--pad-y" = "76px"
"--gap-title" = "48px"
"--gap-item" = "24px"
# How far the second ink is printed beside the first.
"--misregister" = "5px"
# Paper grain over the whole slide (1) or none (0).
"--texture" = "1"
# Pictures printed in the inks (1) or in their own colours (0).
"--duotone" = "1"
"--font-display" = "\"Bricolage Grotesque\", system-ui, sans-serif"
"--font-body" = "\"Bricolage Grotesque\", system-ui, sans-serif"
"--font-mono" = "\"Space Mono\", ui-monospace, Menlo, Consolas, monospace"

[params.fontDisplay]
token = "--font-display"
title = "Display font"
type = "font"

[params.fontBody]
token = "--font-body"
title = "Body font"
type = "font"

[params.misregister]
token = "--misregister"
title = "Misregistration of the headings"
type = "size"
min = 0
max = 10
description = "How far the second ink sits beside the first: 5px by default, up to about 10px; 0px prints in register."

[params.texture]
token = "--texture"
title = "Texture"
type = "switch"
description = "1 (the default) lays paper grain over the slides; 0 leaves clean paper, for a washed-out projector or a handout."

[params.duotone]
token = "--duotone"
title = "Pictures in the inks"
type = "switch"
description = "1 (the default) prints pictures in the two inks; 0 shows them in their own colours, for screenshots, products and photographs whose colours matter."

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["creative and community talks", "meetups and workshops", "student and art-school work", "event and festival announcements"]
avoid = ["formal reports", "dense tables"]
writing = """
Like a zine printed in two inks: big, short headings, printed in the first
ink with the second showing beside them, so keep them to a few words. Title
and chapter slides carry a disc and a halftone block that overprint where
they meet. Emphasis (*word*) is a highlighter stroke in the second ink; bold
is set in the first. Pictures are printed as duotones in the two inks, so
pick ones with clear shapes; where their colours matter (screenshots,
products), set params: duotone: 0 to show them as they are. Small print
(eyebrows, captions, the footer) is set in a typewriter face.
"""
