schema = 1
kind = "theme"
id = "duet"
title = "Duet"
description = "Two voices: heavy slab headings, and two accents that take turns, as split fields, diagonal chapters and alternating markers."
version = "1.1.1"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.6.0"  # the [guide] below
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "cobalt"
fonts = [
  "https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "150px"
"--fs-title" = "112px"
"--fs-focus" = "88px"
"--fs-h" = "68px"
"--fs-sub" = "44px"
"--fs-body" = "34px"
"--fs-small" = "28px"
"--fs-eyebrow" = "24px"

# Spacing
"--pad-x" = "140px"
"--pad-y" = "72px"
"--gap-title" = "52px"
"--gap-item" = "28px"

# Type families
"--font-display" = "\"Zilla Slab\", Georgia, \"Times New Roman\", serif"
"--font-body" = "\"DM Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["comparisons and debates", "before and after", "pros and cons, two sides of a question"]
avoid = ["photo-led talks"]
writing = """
Two accents take turns, so the theme is at its best with two of something. A
split slide (layout: split) is a dialogue of two colour fields: put one side
in each, with a heading that names the contrast. Chapter slides are cut
diagonally between the two colours. Headings are heavy slab serif: keep them
short.
"""
