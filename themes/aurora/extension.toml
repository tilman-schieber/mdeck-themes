schema = 1
kind = "theme"
id = "aurora"
title = "Aurora"
description = "Northern lights: curtains of light in the accent colours, night-sky chapter and statement slides, frosted glass."
version = "1.1.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "neon"
fonts = [
  "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "168px"
"--fs-title" = "112px"
"--fs-focus" = "100px"
"--fs-h" = "76px"
"--fs-sub" = "44px"
"--fs-body" = "34px"
"--fs-small" = "26px"
"--fs-eyebrow" = "20px"

# Spacing
"--pad-x" = "120px"
"--pad-y" = "72px"
"--gap-title" = "48px"
"--gap-item" = "24px"

# Type families
"--font-display" = "\"Plus Jakarta Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"
"--font-body" = "\"Plus Jakarta Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["workshops and evening talks", "inspiring keynotes", "talks with a few big moments"]
avoid = ["dense tables", "slides mostly read on paper"]
writing = """
The light is strongest on title, chapter and statement slides, and chapter
and statement slides turn to a night sky: give the talk a title slide,
numbered chapters (layout: chapter, number: 2) and a few statements
(layout: focus) for its turns. Emphasis (*word*) glows in the accent gradient:
one key word per slide. Content slides stay calm: a heading and a few points.
"""
