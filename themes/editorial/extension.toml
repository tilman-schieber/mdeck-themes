schema = 1
kind = "theme"
id = "editorial"
title = "Editorial"
description = "A magazine spread: Newsreader headlines, Lora text, drop caps, pull quotes and Roman chapter numerals."
version = "1.2.1"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "terra"
fonts = [
  "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
# Deck settings (params) override these.
[tokens]

# Type scale (px) — projection-appropriate at 1920×1080
"--fs-display" = "148px"
"--fs-title" = "112px"
"--fs-focus" = "80px"
"--fs-h" = "68px"
"--fs-sub" = "40px"
"--fs-body" = "32px"
"--fs-small" = "24px"
"--fs-eyebrow" = "22px"

# Spacing
"--pad-x" = "128px"
"--pad-y" = "72px"
"--gap-title" = "48px"
"--gap-item" = "24px"

# Type families
"--font-display" = "\"Newsreader\", Georgia, \"Times New Roman\", serif"
"--font-body" = "\"Lora\", Georgia, \"Times New Roman\", serif"

# Settings authors can change under `params:` in the deck; each points at a token above.
[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["essays and long-form arguments", "humanities and writing", "talks that read like an article"]
avoid = ["code-heavy talks", "dashboards and dense data"]
writing = """
Set like a magazine: a paragraph right after a slide's heading opens with a
drop cap, so lead with a sentence, not a list. A quotation (> …) is a pull
quote, and a statement (layout: focus) a large one; callouts are margin
notes. Chapters open with a Roman numeral (layout: chapter, number: 2).
Write in full sentences; the serif type is made for reading.
"""
