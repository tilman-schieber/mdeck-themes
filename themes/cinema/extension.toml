schema = 1
kind = "theme"
id = "cinema"
title = "Cinema"
description = "Film title cards: black letterbox bars, centred Cormorant titles, quiet subtitles in Inter, the accent as gold."
version = "1.2.1"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3
# The palette this theme uses unless the deck sets one; colours come only from palettes.
palette = "noir"
appearance = "dark"
fonts = [
  "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap",
]

[files]
styles = "styles.css"

# Type, spacing and fonts used by styles.css; colours come from the palette.
[tokens]
"--fs-display" = "150px"
"--fs-title" = "120px"
"--fs-focus" = "88px"
"--fs-h" = "76px"
"--fs-sub" = "40px"
"--fs-body" = "32px"
"--fs-small" = "24px"
"--fs-eyebrow" = "20px"
"--pad-x" = "160px"
# Room for the letterbox bars (70px) above and below.
"--pad-y" = "112px"
"--gap-title" = "48px"
"--gap-item" = "24px"
"--letterbox" = "70px"
"--font-display" = "\"Cormorant Garamond\", Georgia, serif"
"--font-body" = "Inter, system-ui, sans-serif"

[params.fontDisplay]
token = "--font-display"
title = "Display font"

[params.fontBody]
token = "--font-body"
title = "Body font"

# What this theme is for and how to write for it: shown in listings, and read
# by assistants that write slides as the theme author's advice.
[guide]
suits = ["storytelling and narrative talks", "film, art and culture", "talks with few words per slide"]
avoid = ["dense tables", "long lists", "code"]
writing = """
Every slide is a title card: few words, set centred. Make headings short and
let a subtitle or one sentence carry the rest. Statements (layout: focus) are
the strongest slides; use them for quotes and turning points. Emphasis shows
in gold: one word at a time. Dark by default.
"""
