# Every pull request: the packs are checked as mdeck will check them, and
# every theme and palette goes through the theme check.
name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MDECK_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The packs are checked by mdeck as it is on its main branch.
      - uses: actions/checkout@v4
        with: { repository: tilman-schieber/mdeck, path: .mdeck }
      - run: npm ci --prefix .mdeck --omit=dev
      - run: node .mdeck/bin/mdeck.js themes build packs -o site --check
