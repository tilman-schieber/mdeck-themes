schema = 1
kind = "palette"
id = "candy"
title = "Candy"
description = "Cream with raspberry and blue, and pastel fills for Pop; dusk violet in the dark."
version = "1.0.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.1.0"
[light]
"--bg" = "#fffaf0"
"--surface" = "#fff1d6"
"--ink" = "#111111"
"--ink-soft" = "#262626"
"--muted" = "#555555"
"--rule" = "#e3d9c4"
"--accent" = "#c2185b"
"--accent-2" = "#1f6fbf"
"--on-accent" = "#ffffff"
# Pop's pastel fills, which the accents above are too dark for.
"--pop-fill-1" = "#ffdce2"
"--pop-fill-2" = "#ddecf4"
[dark]
# Pop: black shadows under the light outlines, for depth without glare.
"--pop-shadow" = "#000000"
"--bg" = "#17151c"
"--surface" = "#221f2a"
"--ink" = "#f7f3ea"
"--ink-soft" = "#dcd7cc"
"--muted" = "#9e99a8"
"--rule" = "#34303d"
"--accent" = "#ff7eb6"
"--accent-2" = "#7cc6fe"
"--on-accent" = "#111111"
