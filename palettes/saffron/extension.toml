schema = 1
kind = "palette"
id = "saffron"
title = "Saffron"
description = "A coloured background: brick red and deep blue on warm saffron, and saffron on ultramarine in the dark."
version = "1.1.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.1.0"

# The whole slide is coloured. Themes tint fields by mixing an accent into
# the background, and blue mixed into saffron turns olive, so red leads in
# the light and blue comes second (and fills the whole dark variant). Code
# has its own colours, dark enough for the saffron surface.
[light]
"--bg" = "#f2c94c"
"--surface" = "#f8e2a0"
"--ink" = "#1c1a17"
"--ink-soft" = "#2f2a22"
"--muted" = "#5a4a24"
"--rule" = "#d9ac2e"
"--accent" = "#a3241b"
"--accent-2" = "#1d3b8f"
"--on-accent" = "#fff6dc"
"--token-default" = "#1c1a17"
"--token-comment" = "#5f5434"
"--token-string" = "#2f6312"
"--token-number" = "#8a2b1c"
"--token-keyword" = "#1d3b8f"
"--token-function" = "#7a1f5a"
"--token-operator" = "#5e4100"

[dark]
"--bg" = "#1c2d6e"
"--surface" = "#243780"
"--ink" = "#fff6dc"
"--ink-soft" = "#e9dfc3"
"--muted" = "#b9b6cf"
"--rule" = "#33479a"
"--accent" = "#f6c945"
"--accent-2" = "#ff8f7a"
"--on-accent" = "#1c2d6e"
"--token-default" = "#fff6dc"
"--token-comment" = "#bcc2e0"
"--token-string" = "#a8e08a"
"--token-number" = "#ffb3a3"
"--token-keyword" = "#f6c945"
"--token-function" = "#e7c3ff"
"--token-operator" = "#ffd9a0"
