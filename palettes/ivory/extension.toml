schema = 1
kind = "palette"
id = "ivory"
title = "Ivory"
description = "Near-black ink on the faint ivory of a book page, one muted red for emphasis; code in ink and greys; at night, warm grey on near-black."
version = "0.1.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.7.0"  # the third accent, --accent-3

# The colours of Tufte's books: the page is not quite white, the text not
# quite black, and colour is rare. The accent is a muted red, as on his
# charts where one line matters; the second a slate blue as its quiet
# companion; the third an ochre for warnings. Code stays in ink and greys,
# with the strings in the slate and the numbers in the red.

[light]
"--bg" = "#fffff8"
"--surface" = "#f5f3e6"
"--ink" = "#111111"
"--ink-soft" = "#242422"
"--muted" = "#6a685f"
"--rule" = "#d8d4c0"
"--accent" = "#9e1b14"
"--accent-2" = "#3d5a75"
"--accent-3" = "#c8901a"
"--on-accent" = "#fffff8"
"--token-default" = "#111111"
"--token-comment" = "#7d7b72"
"--token-string" = "#3d5a75"
"--token-number" = "#9e1b14"
"--token-keyword" = "#111111"
"--token-function" = "#242422"
"--token-operator" = "#6a685f"

[dark]
"--bg" = "#151515"
"--surface" = "#1f1f1c"
"--ink" = "#dddcd5"
"--ink-soft" = "#c9c8c0"
"--muted" = "#8f8d84"
"--rule" = "#3a3934"
"--accent" = "#e57f72"
"--accent-2" = "#93afc9"
"--accent-3" = "#e0b04f"
"--on-accent" = "#151515"
"--token-default" = "#dddcd5"
"--token-comment" = "#8f8d84"
"--token-string" = "#93afc9"
"--token-number" = "#e57f72"
"--token-keyword" = "#f2f1ea"
"--token-function" = "#c9c8c0"
"--token-operator" = "#8f8d84"
