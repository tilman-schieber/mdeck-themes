schema = 1
kind = "palette"
id = "phosphor"
title = "Phosphor"
description = "A green monochrome screen: every colour a shade of phosphor green, code and callouts too; in light, a printout in green ribbon on white."
version = "2.1.0"
author = "Tilman Schieber"
license = "MIT"
mdeck = ">=3.1.0"

# One hue only, as on a monochrome monitor: brightness does the work. The
# accent is the brightest green, like bold text glowing on the tube; the
# second accent a deeper, more saturated green; the third (warnings) a
# mid green in the light and a vivid one at night.

[light]
"--bg" = "#fbfdf9"
"--surface" = "#edf5ec"
"--ink" = "#0b3d1a"
"--ink-soft" = "#145a28"
"--muted" = "#3a7049"
"--rule" = "#cfe3d2"
"--accent" = "#0f8a35"
"--accent-2" = "#2b6e3c"
"--accent-3" = "#5bb974"
"--on-accent" = "#ffffff"
"--token-default" = "#0b3d1a"
"--token-comment" = "#5f8a68"
"--token-string" = "#1f7a3d"
"--token-number" = "#0f8a35"
"--token-keyword" = "#0b5d27"
"--token-function" = "#145a28"
"--token-operator" = "#3a7049"

[dark]
"--bg" = "#040a05"
"--surface" = "#0a160c"
"--ink" = "#7dff9a"
"--ink-soft" = "#5fd67a"
"--muted" = "#3f9a55"
"--rule" = "#143a1d"
"--accent" = "#d4ffdc"
"--accent-2" = "#22c55e"
"--accent-3" = "#39ff6e"
"--on-accent" = "#040a05"
"--token-default" = "#7dff9a"
"--token-comment" = "#3f9a55"
"--token-string" = "#a8ffbc"
"--token-number" = "#d4ffdc"
"--token-keyword" = "#d4ffdc"
"--token-function" = "#5fd67a"
"--token-operator" = "#22c55e"
